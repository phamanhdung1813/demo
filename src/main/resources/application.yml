spring:
  datasource:
    url: jdbc:h2:mem:dungdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL;
    username: admin
    password: admin
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  opentelemetry:
    tracing:
      export:
        enabled: false

  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-},spanId=%X{spanId:-}] "
    console: "%d %-5level ${LOG_CORRELATION_PATTERN:-} %logger - %msg%n"

  level:
    root: INFO
    org.springframework.transaction: TRACE
    org.springframework.orm.jpa: TRACE
    org.springframework.transaction.interceptor: TRACE
    org.springframework.transaction.support: TRACE